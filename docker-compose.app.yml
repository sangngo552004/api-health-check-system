version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: api-health-check-postgres
    environment:
      POSTGRES_DB: api_health_check
      POSTGRES_USER: api_health_user
      POSTGRES_PASSWORD: api_health_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: api-health-check-backend
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/api_health_check
      DB_USERNAME: api_health_user
      DB_PASSWORD: api_health_password
      SERVER_PORT: 8080
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      APP_NOTIFICATION_WEBHOOK_URL: ${APP_NOTIFICATION_WEBHOOK_URL:-}
    ports:
      - "8080:8080"

  demo-service:
    build:
      context: ./demo-service
    container_name: api-health-check-demo-service
    environment:
      SERVER_PORT: 8086
    ports:
      - "8086:8086"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    container_name: api-health-check-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
