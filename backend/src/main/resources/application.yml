spring:
  application:
    name: api-health-check-system
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    outOfOrder: true
    validateOnMigrate: false
    repairOnMigrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  jwt:
    secret: ${APP_JWT_SECRET:ZGV2LWFwaS1oZWFsdGgtY2hlY2stc3lzdGVtLWp3dC1zZWNyZXQta2V5LTEyMzQ1Njc4OTA=}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:86400000}
    refresh-cookie:
      name: ${APP_JWT_REFRESH_COOKIE_NAME:refresh_token}
      path: ${APP_JWT_REFRESH_COOKIE_PATH:/api/v1/auth}
      secure: ${APP_JWT_REFRESH_COOKIE_SECURE:false}
      same-site: ${APP_JWT_REFRESH_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  notification:
    webhook-url: ${APP_NOTIFICATION_WEBHOOK_URL:}
    webhook-timeout-ms: ${APP_NOTIFICATION_WEBHOOK_TIMEOUT_MS:5000}
