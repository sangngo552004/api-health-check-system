spring:
  application:
    name: api-health-check-system
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    outOfOrder: true
    validateOnMigrate: false
    repairOnMigrate: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  async:
    executor:
      core-pool-size: ${APP_ASYNC_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${APP_ASYNC_EXECUTOR_MAX_POOL_SIZE:4}
      queue-capacity: ${APP_ASYNC_EXECUTOR_QUEUE_CAPACITY:100}
    shutdown-await-seconds: ${APP_ASYNC_SHUTDOWN_AWAIT_SECONDS:10}
  scheduler:
    interval-ms: ${APP_SCHEDULER_INTERVAL_MS:600000}
    pool-size: ${APP_SCHEDULER_POOL_SIZE:1}
  jwt:
    secret: ${APP_JWT_SECRET:ZGV2LWFwaS1oZWFsdGgtY2hlY2stc3lzdGVtLWp3dC1zZWNyZXQta2V5LTEyMzQ1Njc4OTA=}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:86400000}
    refresh-cookie:
      name: ${APP_JWT_REFRESH_COOKIE_NAME:refresh_token}
      path: ${APP_JWT_REFRESH_COOKIE_PATH:/api/v1/auth}
      secure: ${APP_JWT_REFRESH_COOKIE_SECURE:false}
      same-site: ${APP_JWT_REFRESH_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  notification:
    mail:
      enabled: ${APP_NOTIFICATION_MAIL_ENABLED}
      from: ${SPRING_MAIL_USERNAME}
